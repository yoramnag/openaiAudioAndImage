spring.application.name=openaiAudioAndImage
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=he
spring.ai.openai.audio.transcription.options.response-format=vtt
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
